<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratório de Botão CSS</title>

    <style>

        /* ==============================
           ÁREA DA PÁGINA
        ============================== */

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f1f5f9;

            font-family: Arial, sans-serif;
        }


        /* ==============================
           BOTÃO
        ============================== */

        button {

            /* ===== TAMANHO ===== */

            width: 220px;
            height: 70px;


            /* ===== ESPAÇO INTERNO ===== */

            padding: 10px 20px;


            /* ===== BORDA ===== */

            border: 3px solid #40916c;
            border-radius: 20px;


            /* ===== CORES ===== */

            background-color: #b7e4c7;
            color: #1b4332;


            /* ===== TEXTO ===== */

            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;


            /* ===== CURSOR ===== */

            cursor: pointer;


            /* ===== SOMBRA ===== */

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.20);


            /* ===== COMPORTAMENTO ===== */

            display: block;

            margin: 10px auto;


            /* ===== TRANSIÇÃO ===== */

            transition: all 0.3s ease;
        }


        /* ==============================
           QUANDO O MOUSE PASSA
        ============================== */

        button:hover {

            background-color: #40916c;

            color: white;

            border-color: #1b4332;

            transform: scale(1.05);

            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.30);
        }


        /* ==============================
           QUANDO O BOTÃO É PRESSIONADO
        ============================== */

        button:active {

            transform: scale(0.95);

            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.20);
        }


        /* ==============================
           QUANDO RECEBE FOCO
        ============================== */

        button:focus {

            outline: 4px solid #74c69d;

            outline-offset: 4px;
        }

    </style>
</head>

<body>

    <button>
        Agendar atendimento
    </button>

</body>
</html>
